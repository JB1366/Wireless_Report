name: Auto-Sign Script

on:
  push:
    paths:
      - 'wirelessreport.sh'

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Private Key from GitHub Secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          # Safely write the secret key without echo newline issues
          printf '%s\n' "$SIGNING_KEY" > signing.key
          chmod 600 signing.key

          # Diagnostic: verify OpenSSL can read the key structure without failing
          openssl pkey -in signing.key -noout || { echo "Error: OpenSSL cannot read the private key format."; exit 1; }

      - name: Generate Ed25519 Signature
        run: |
          openssl pkeyutl -sign -inkey signing.key -rawin -in wirelessreport.sh -out wirelessreport.sh.sig

      - name: Commit and Push .sig back to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add wirelessreport.sh.sig
          git commit -m "chore: auto-generate cryptographic signature for release [skip ci]" || exit 0
          git push